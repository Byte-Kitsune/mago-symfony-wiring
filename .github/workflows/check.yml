name: Check
on: [push, pull_request]
jobs:
  extension:
    env:
      MAGO_EXTENSION_BACKEND: ${{ matrix.backend == 'php' && 'php' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mago: "1.50.0", backend: php, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "^1.50", backend: php, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "^1.50", backend: rust, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64}
          - {mago: "^1.50", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64}
          - {mago: "^1.50", backend: rust, runner: macos-15, asset: macos-arm64}
          - {mago: "^1.50", backend: rust, runner: macos-15-intel, asset: macos-x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Build native engine
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          cargo +1.99.0 fmt --manifest-path native/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo +1.99.0 test --locked --manifest-path native/Cargo.toml
          cargo +1.99.0 build --release --locked --manifest-path native/Cargo.toml
          echo "MAGO_NATIVE_ENGINE=$GITHUB_WORKSPACE/native/target/release/mago-extension-engine" >> "$GITHUB_ENV"
          echo "MAGO_NATIVE_STRICT=1" >> "$GITHUB_ENV"
      - name: Verify native default and runtime behavior
        if: matrix.backend == 'rust'
        run: |
          php tests/assert-native-platform.php
          php tests/assert-native-runtime.php
          php tests/assert-native-trace-path.php
          php tests/assert-native-install.php
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: sh tests/smoke.sh
      - name: Compare complete PHP and Rust reports
        if: matrix.backend == 'rust'
        run: python3 tests/native-parity.py "$GITHUB_WORKSPACE"
      - name: Package native engine
        if: matrix.backend == 'rust' && matrix.mago == '^1.50'
        run: |
          mkdir -p release-assets
          cp native/target/release/mago-extension-engine release-assets/mago-extension-engine-${{ matrix.asset }}
          python3 tests/assert-native-binary.py "${{ matrix.asset }}" "release-assets/mago-extension-engine-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'rust' && matrix.mago == '^1.50'
        with:
          name: native-${{ matrix.asset }}
          path: release-assets/mago-extension-engine-${{ matrix.asset }}
          if-no-files-found: error
