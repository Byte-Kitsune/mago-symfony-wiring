name: Check
on: [push, pull_request]
jobs:
  extension:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mago: ["1.50.0", "^1.50"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: sh tests/smoke.sh
