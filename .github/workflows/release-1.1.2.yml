name: Release 1.1.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.1.2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mago: ["1.50.0", "^1.50"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --format=plain
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: sh tests/smoke.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ['GH_REPO']
          sha = os.environ['RELEASE_SHA']
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None:
                      return None
                  raise
          tag = api('/git/ref/tags/v1.1.2')
          if tag is None:
              tag = api('/git/refs', {'ref': 'refs/tags/v1.1.2', 'sha': sha})
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != sha:
              raise RuntimeError('Existing v1.1.2 does not point to this verified commit')
          release = api('/releases/tags/v1.1.2')
          if release is None:
              release = api('/releases', {
                  'tag_name': 'v1.1.2', 'target_commitish': sha,
                  'name': '1.1.2', 'draft': False, 'prerelease': False,
                  'make_latest': 'true',
                  'body': 'Allow Mago >=1.50 and <2.0 instead of pinning 1.50.x. Use major-version Mago configuration and validate the complete extension suite against the supported minimum and latest compatible release.\n\nValidated with PHP 8.5, Mago 1.50.0 and 1.56.3, Composer validation and audit.'})
          if release['draft'] or release['prerelease']:
              raise RuntimeError('Release is not published as stable')
          print(release['html_url'])
