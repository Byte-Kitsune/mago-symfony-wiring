name: Release 1.2.0-RC1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.2.0-RC1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mago: ["1.50.0", "^1.50"]
        backend: ["php", "rust"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Build native engine
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          cargo +1.99.0 fmt --manifest-path native/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo +1.99.0 test --locked --manifest-path native/Cargo.toml
          cargo +1.99.0 build --release --locked --manifest-path native/Cargo.toml
          echo "MAGO_NATIVE_ENGINE=$GITHUB_WORKSPACE/native/target/release/mago-extension-engine" >> "$GITHUB_ENV"
          echo "MAGO_NATIVE_STRICT=1" >> "$GITHUB_ENV"
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: sh tests/smoke.sh
      - name: Compare complete PHP and Rust reports
        if: matrix.backend == 'rust'
        run: python3 tests/native-parity.py "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'rust' && matrix.mago == '^1.50'
        with:
          name: native-linux-x86_64
          path: native/target/release/mago-extension-engine
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: release-assets
      - name: Publish candidate tag, prerelease and native assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: 1.2.0-RC1
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, pathlib, hashlib
          repo = os.environ['GH_REPO']
          sha = os.environ['RELEASE_SHA']
          version = os.environ['RELEASE_VERSION']
          tagname = 'v' + version
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=None if data is None else json.dumps(data).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(req) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None: return None
                  raise
          tag = api('/git/ref/tags/' + tagname)
          if tag is None: tag = api('/git/refs', {'ref': 'refs/tags/' + tagname, 'sha': sha})
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != sha: raise RuntimeError('Existing tag points to another commit')
          release = api('/releases/tags/' + tagname)
          if release is None:
              release = api('/releases', {'tag_name': tagname, 'target_commitish': sha, 'name': version, 'draft': False, 'prerelease': True, 'make_latest': 'false', 'body': 'Release candidate for the optional shared Rust computational backend. PHP retains SDK integration, configuration and reporting. Set MAGO_NATIVE_ENGINE to the absolute path of the native executable to enable Rust; the default remains PHP.\n\nValidated with PHP 8.5, minimum and latest compatible Mago >=1.50,<2.0, complete PHP/Rust fixture-report parity, Rust unit tests and Clippy. Linux x86_64 binary and SHA-256 checksum are attached. macOS/Windows are not validated; build native/Cargo.toml with Rust 1.99.0. See NATIVE_BACKEND.md for installation and limitations.'})
          if release['draft'] or not release['prerelease']: raise RuntimeError('Release must be a published prerelease')
          binary = pathlib.Path('release-assets/mago-extension-engine')
          assetname = 'mago-extension-engine-linux-x86_64'
          checksum = (hashlib.sha256(binary.read_bytes()).hexdigest() + '  ' + assetname + '\n').encode()
          assets = api('/releases/' + str(release['id']) + '/assets')
          for name, data in [(assetname, binary.read_bytes()), (assetname + '.sha256', checksum)]:
              if any(a['name'] == name for a in assets): continue
              upload = release['upload_url'].split('{')[0] + '?name=' + name
              req = urllib.request.Request(upload, data=data, headers={**headers, 'Content-Type': 'application/octet-stream'}, method='POST')
              with urllib.request.urlopen(req) as response: json.load(response)
          print(release['html_url'])
