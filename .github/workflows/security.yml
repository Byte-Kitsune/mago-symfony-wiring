name: Security Check

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate lockfile and audit locked dependencies
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/work,readonly" \
            -e COMPOSER_HOME=/tmp/composer-home \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
            -w /work --entrypoint sh \
            composer:2.8@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            -ec 'composer validate --strict --no-check-publish && composer audit --locked --format=plain'
