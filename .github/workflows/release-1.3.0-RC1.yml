name: Release 1.3.0-RC1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.3.0-RC1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    env:
      MAGO_EXTENSION_BACKEND: ${{ matrix.backend == 'php' && 'php' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mago: "1.50.0", backend: php, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "^1.50", backend: php, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "^1.50", backend: rust, runner: ubuntu-latest, asset: linux-x86_64}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64}
          - {mago: "^1.50", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-latest, asset: linux-x86_64-musl, target: x86_64-unknown-linux-musl}
          - {mago: "^1.50", backend: rust, runner: ubuntu-latest, asset: linux-x86_64-musl, target: x86_64-unknown-linux-musl}
          - {mago: "1.50.0", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64-musl, target: aarch64-unknown-linux-musl}
          - {mago: "^1.50", backend: rust, runner: ubuntu-22.04-arm, asset: linux-arm64-musl, target: aarch64-unknown-linux-musl}
          - {mago: "^1.50", backend: rust, runner: macos-15, asset: macos-arm64}
          - {mago: "^1.50", backend: rust, runner: macos-15-intel, asset: macos-x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Build native engine
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          target="${{ matrix.target }}"
          target_args=""
          output="native/target/release/mago-extension-engine"
          if [ -n "$target" ]; then
            sudo apt-get update
            sudo apt-get install --yes musl-tools
            rustup target add --toolchain 1.99.0 "$target"
            host=$(rustc +1.99.0 -vV | sed -n 's/^host: //p')
            sysroot=$(rustc +1.99.0 --print sysroot)
            export RUSTFLAGS="-C target-feature=+crt-static -C linker=$sysroot/lib/rustlib/$host/bin/rust-lld"
            export CC=musl-gcc
            target_args="--target $target"
            output="native/target/$target/release/mago-extension-engine"
          fi
          cargo +1.99.0 fmt --manifest-path native/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path native/Cargo.toml --all-targets $target_args -- -D warnings
          cargo +1.99.0 test --locked --manifest-path native/Cargo.toml $target_args
          cargo +1.99.0 build --release --locked --manifest-path native/Cargo.toml $target_args
          echo "MAGO_NATIVE_ENGINE=$GITHUB_WORKSPACE/$output" >> "$GITHUB_ENV"
          echo "MAGO_NATIVE_STRICT=1" >> "$GITHUB_ENV"
      - name: Verify native default and runtime behavior
        if: matrix.backend == 'rust'
        run: |
          php tests/assert-native-platform.php
          php tests/assert-native-runtime.php
          php tests/assert-native-trace-path.php
          php tests/assert-native-install.php
      - name: Verify static musl engine and PHP adapter in Alpine
        if: matrix.target != ''
        run: sh tests/alpine-native-smoke.sh
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: php tests/framework-hook-tags.php
      - run: sh tests/smoke.sh
      - name: Compare complete PHP and Rust reports
        if: matrix.backend == 'rust'
        run: python3 tests/native-parity.py "$GITHUB_WORKSPACE"
      - name: Package native engine
        if: matrix.backend == 'rust' && matrix.mago == '^1.50'
        run: |
          mkdir -p release-assets
          cp "$MAGO_NATIVE_ENGINE" release-assets/mago-extension-engine-${{ matrix.asset }}
          python3 tests/assert-native-binary.py "${{ matrix.asset }}" "release-assets/mago-extension-engine-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'rust' && matrix.mago == '^1.50'
        with:
          name: native-${{ matrix.asset }}
          path: release-assets/mago-extension-engine-${{ matrix.asset }}
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish candidate tag, release and native assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: 1.3.0-RC1
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, pathlib, hashlib
          repo = os.environ['GH_REPO']
          sha = os.environ['RELEASE_SHA']
          version = os.environ['RELEASE_VERSION']
          tagname = 'v' + version
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=None if data is None else json.dumps(data).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(req) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None: return None
                  raise
          tag = api('/git/ref/tags/' + tagname)
          if tag is None: tag = api('/git/refs', {'ref': 'refs/tags/' + tagname, 'sha': sha})
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != sha: raise RuntimeError('Existing tag points to another commit')
          release = api('/releases/tags/' + tagname)
          if release is None:
              release = api('/releases', {'tag_name': tagname, 'target_commitish': sha, 'name': version, 'draft': False, 'prerelease': True, 'make_latest': 'false', 'body': 'Candidate shared engine 0.4.0 adds PHP 8.5 callback effects, typed Doctrine provenance and conservative Symfony/transaction callback tracing. All adapters in one worker must use engine 0.4.0. Static estimates are logical call bounds, not measured SQL. Unsupported dynamic paths remain incomplete. See README.md and NATIVE_BACKEND.md for coverage, installation and limitations. Validated with the minimum/latest compatible Mago, PHP/Rust fixture parity, Rust unit tests and Clippy; GNU/musl Linux x86_64/arm64 and macOS arm64/x86_64 binaries include SHA-256 checksums. Project-specific acceptance remains pending.'})
          if release['draft'] or not release['prerelease']: raise RuntimeError('Release must be a published prerelease')
          assets = api('/releases/' + str(release['id']) + '/assets')
          for platform in ['linux-x86_64', 'linux-arm64', 'linux-x86_64-musl', 'linux-arm64-musl', 'macos-arm64', 'macos-x86_64']:
              assetname = 'mago-extension-engine-' + platform
              binary = pathlib.Path('release-assets') / assetname
              checksum = (hashlib.sha256(binary.read_bytes()).hexdigest() + '  ' + assetname + '\n').encode()
              for name, data in [(assetname, binary.read_bytes()), (assetname + '.sha256', checksum)]:
                  if any(a['name'] == name for a in assets): continue
                  upload = release['upload_url'].split('{')[0] + '?name=' + name
                  req = urllib.request.Request(upload, data=data, headers={**headers, 'Content-Type': 'application/octet-stream'}, method='POST')
                  with urllib.request.urlopen(req) as response: json.load(response)
          print(release['html_url'])
