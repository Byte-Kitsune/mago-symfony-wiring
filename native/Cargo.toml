[package]
name = "mago-extension-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.11"
mago-syntax = { git = "https://github.com/carthage-software/mago", rev = "1993be090f12ea01d8c5715154659d7e75affe25" }
mago-names = { git = "https://github.com/carthage-software/mago", rev = "1993be090f12ea01d8c5715154659d7e75affe25" }
mago-allocator = { git = "https://github.com/carthage-software/mago", rev = "1993be090f12ea01d8c5715154659d7e75affe25" }
mago-span = { git = "https://github.com/carthage-software/mago", rev = "1993be090f12ea01d8c5715154659d7e75affe25" }
mago-database = { git = "https://github.com/carthage-software/mago", rev = "1993be090f12ea01d8c5715154659d7e75affe25" }

[profile.release]
lto = "thin"
codegen-units = 1
